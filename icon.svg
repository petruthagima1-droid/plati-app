<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1442c4"/>
      <stop offset="50%" stop-color="#0fa8a0"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc95c"/>
      <stop offset="100%" stop-color="#f4901e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>

  <!-- sparkles -->
  <path d="M20 16 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#ffe27a" opacity="0.9"/>
  <path d="M78 14 l1.1 2.8 2.8 1.1 -2.8 1.1 -1.1 2.8 -1.1 -2.8 -2.8 -1.1 2.8 -1.1 z" fill="#ffffff" opacity="0.8"/>

  <!-- Receipt / bill -->
  <path d="M16 30 h30 v42 l-4 -3 -4 3 -4 -3 -4 3 -4 -3 -4 3 -4 -3 -4 3 z" fill="#ffffff"/>
  <rect x="21" y="38" width="20" height="3" rx="1.5" fill="#5b7a94"/>
  <rect x="21" y="46" width="16" height="3" rx="1.5" fill="#5b7a94"/>
  <rect x="21" y="54" width="20" height="3" rx="1.5" fill="#5b7a94"/>
  <rect x="21" y="62" width="12" height="3" rx="1.5" fill="#e2543d"/>

  <!-- Phone with checkmark -->
  <rect x="52" y="20" width="32" height="56" rx="7" fill="#0f2f4a"/>
  <rect x="55.5" y="25" width="25" height="42" rx="2" fill="#eef6fb"/>
  <circle cx="68" cy="46" r="13" fill="#1f9e5b"/>
  <path d="M61.5 46 L66 50.5 L75 40.5" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="63" y="70.5" width="10" height="2.6" rx="1.3" fill="#5b7a94"/>

  <!-- Coin stack -->
  <ellipse cx="82" cy="86" rx="12" ry="7" fill="#c9761a"/>
  <ellipse cx="82" cy="83" rx="12" ry="7" fill="url(#coinGrad)"/>
  <text x="82" y="87" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#8a4d0a" text-anchor="middle">$</text>
</svg>
