<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2f4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Plăți</title>
<style>
  :root {
    --paper: #eef6fb;
    --card: #ffffff;
    --ink: #0f2f4a;
    --ink-soft: #5b7a94;
    --line: #cfe3ee;
    --accent: #2f80ed;
    --green: #1f9e5b;
    --paid: #1f9e5b;
    --due: #e2543d;
    --stamp: #7fa8c9;
    --font-display: 'Courier New', monospace;
    --font-body: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-bottom: 90px;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-bottom: 3px solid var(--accent);
    padding: 16px 20px 12px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 2px;
    margin: 0;
    text-transform: uppercase;
    color: var(--ink);
  }

  main {
    padding: 12px 16px;
    max-width: 600px;
    margin: 0 auto;
    transition: opacity 0.15s ease;
  }

  main.tab-fade-out {
    opacity: 0;
  }

  /* Connect bar */
  .connect-bar {
    padding: 10px 16px 0;
    max-width: 600px;
    margin: 0 auto;
  }

  .btn-connect {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #4f9cf0);
    color: #fff;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(47,128,237,0.35);
  }

  .btn-connect:active { transform: scale(0.98); }

  @keyframes connectPulse {
    0%, 100% { box-shadow: 0 3px 10px rgba(47,128,237,0.35); }
    50% { box-shadow: 0 3px 20px rgba(47,128,237,0.7); }
  }

  .btn-connect {
    animation: connectPulse 2.2s ease-in-out infinite;
  }

  .connect-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .connect-status .status-text { flex: 1; }
  .connect-status .status-text.error { color: var(--due); }
  .connect-status .status-text.syncing { color: var(--accent); }

  .link-btn {
    border: none;
    background: transparent;
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--accent);
    cursor: pointer;
    padding: 2px 6px;
  }

  .link-btn.text { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }
  .link-btn.danger { color: var(--due); }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .group {
    margin-bottom: 18px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 8px;
    overflow: hidden;
    animation: rowIn 0.3s ease both;
  }

  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    color: #ffffff;
    font-family: var(--font-display);
  }

  .group-header .date {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .group-header .totals {
    font-size: 14px;
    font-weight: bold;
    text-align: right;
  }

  .bill {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    position: relative;
    animation: rowIn 0.26s ease both;
    max-height: 100px;
    overflow: hidden;
    transition: max-height 0.32s ease, opacity 0.28s ease, padding 0.32s ease, border-bottom-width 0.32s ease, background-color 0.3s ease;
  }

  .bill:last-child { border-bottom: none; }

  .bill.row-checking {
    background-color: rgba(31,158,91,0.16);
  }

  .bill.row-collapsing {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-bottom-width: 0;
  }

  .checkbox {
    width: 27px;
    height: 27px;
    border: 2px solid var(--ink-soft);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: transparent;
    color: var(--paid);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  @keyframes checkPop {
    0% { transform: scale(0.7); }
    55% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  .checkbox.checking {
    background: var(--paid);
    border-color: var(--paid);
    color: #fff;
    animation: checkPop 0.32s ease;
  }

  .bill-info {
    flex: 1;
    min-width: 0;
  }

  .bill-info .furnizor {
    font-weight: 650;
    font-size: 16.5px;
    margin-bottom: 2px;
  }

  .bill-info .scadenta {
    font-size: 13px;
    color: var(--ink-soft);
    font-family: var(--font-display);
  }

  .bill-info .scadenta.overdue {
    color: var(--due);
    font-weight: bold;
  }

  .suma {
    font-family: var(--font-display);
    font-size: 18.5px;
    font-weight: bold;
    white-space: nowrap;
    color: var(--ink);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }

  @keyframes stampPop {
    0% { transform: rotate(-4deg) scale(0.7); opacity: 0; }
    70% { transform: rotate(-4deg) scale(1.08); opacity: 1; }
    100% { transform: rotate(-4deg) scale(1); opacity: 1; }
  }

  .empty-state .stamp {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 3px;
    border: 2px solid var(--stamp);
    color: var(--accent);
    display: inline-block;
    padding: 8px 16px;
    transform: rotate(-4deg);
    border-radius: 8px;
    margin-bottom: 16px;
    background: var(--card);
    animation: stampPop 0.4s ease;
  }

  /* Header add button */
  .header-add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(47,128,237,0.4);
  }

  .header-add-btn:active { transform: scale(0.95); }

  /* Bottom nav */
  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: var(--card);
    border-top: 2px solid var(--line);
    z-index: 15;
    padding-bottom: env(safe-area-inset-bottom);
  }

  nav.tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 0 10px;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  nav.tabs button .icon { font-size: 18px; }

  nav.tabs button.active { color: var(--ink); font-weight: bold; }
  nav.tabs button.active .icon { color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,47,74,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .modal-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: var(--paper);
    width: 100%;
    max-width: 600px;
    border-top: 3px solid var(--accent);
    border-radius: 16px 16px 0 0;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .modal-overlay.visible .modal {
    transform: translateY(0);
  }

  .modal h2 {
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 16px;
    font-size: 18px;
    color: var(--ink);
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 16px;
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-body);
  }

  .field input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .field-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .field-checkbox input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: 2px solid var(--ink-soft);
    background: transparent;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.danger {
    border-color: var(--due);
    color: var(--due);
  }

  .btn.secondary {
    border-color: var(--green);
    color: var(--green);
  }

  .btn:active { transform: scale(0.98); }

  .hidden { display: none !important; }

  /* Overdue badge */
  @keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .overdue-badge {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    background: var(--due);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    animation: badgePulse 1.8s ease-in-out infinite;
  }

  /* Pull to refresh */
  @keyframes arrowBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  .pull-indicator {
    text-align: center;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    padding: 8px 0 0;
    height: 0;
    overflow: hidden;
    transition: height 0.15s ease;
  }

  .pull-indicator.visible {
    height: 28px;
    animation: arrowBounce 0.6s ease-in-out infinite;
  }

  /* History page */
  .history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 14px;
    border: 1px solid var(--line);
    margin-bottom: 6px;
    border-radius: 8px;
    background: var(--card);
    animation: rowIn 0.26s ease both;
  }

  .history-row .furnizor {
    font-weight: 650;
    font-size: 15px;
    margin-bottom: 2px;
  }

  .history-row .dates {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: var(--font-display);
  }

  .history-row .suma {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: bold;
    color: var(--paid);
    white-space: nowrap;
  }

  .duplicate-row {
    margin-top: 10px;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 12px;
  }

  .loading-overlay .stamp-text {
    font-family: var(--font-display);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--ink-soft);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
</style>
</head>
<body>

<header>
  <h1>Plăți</h1>
  <button class="header-add-btn hidden" id="fabAdd">+</button>
</header>

<div class="connect-bar" id="connectBar"></div>

<div class="pull-indicator" id="pullIndicator">↓ Trage pentru sincronizare</div>
<main id="mainContent"></main>

<nav class="tabs">
  <button class="active" data-tab="bills"><span class="icon">▤</span>Plăți</button>
  <button data-tab="history"><span class="icon">◷</span>Istoric</button>
</nav>

<!-- Edit/Add Modal -->
<div class="modal-overlay hidden" id="editModalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Plată nouă</h2>
    <div class="field">
      <label>Furnizor</label>
      <input type="text" id="inputFurnizor" placeholder="ex: DIGI">
    </div>
    <div class="field">
      <label>Sumă (lei)</label>
      <input type="number" id="inputSuma" placeholder="0" inputmode="decimal">
    </div>
    <div class="field">
      <label>Scadență</label>
      <input type="date" id="inputScadenta">
    </div>
    <div class="field">
      <label>Data plății (1 sau 15)</label>
      <input type="date" id="inputDataPlatii">
    </div>
    <div class="field" id="fieldRecurring">
      <label>Repetă pe (câte luni, opțional)</label>
      <input type="number" id="inputRecurringMonths" min="2" max="36" placeholder="ex: 6">
    </div>
    <div class="field" id="fieldApplyFuture" style="display:none;">
      <label class="field-checkbox">
        <input type="checkbox" id="inputApplyFuture">
        Aplică suma la toate plățile viitoare cu acest furnizor
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">Anulează</button>
      <button class="btn primary" id="btnSave">Salvează</button>
    </div>
    <div class="modal-actions" id="deleteRow" style="display:none;">
      <button class="btn danger" id="btnDelete">Șterge plata</button>
    </div>
    <div class="modal-actions duplicate-row" id="duplicateRow" style="display:none;">
      <button class="btn secondary" id="btnDuplicate">Duplică pentru luna viitoare</button>
    </div>
  </div>
</div>

<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="stamp-text">Se sincronizează…</div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
